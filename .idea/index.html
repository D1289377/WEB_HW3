<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蝦皮購物登入頁</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- 頁首 logo -->
<header class="header">
    <img src="蝦皮購物.jpg" alt="蝦皮購物" class="logo" />
    <a href="#" class="help-link">需要幫助？</a>
</header>

<!-- 主要內容 -->
<div class="main">
    <!-- 左側圖片 -->
    <div class="left-image">
        <img src="購物節.jpg" alt="購物節" />
    </div>

    <!-- 右側登入表單 -->
    <div class="login-box">
        <h2>登入</h2>
        <form id="login-form">
            <input type="text" placeholder="手機號碼或使用者名稱" required />
            <input type="password" placeholder="密碼" required />
            <button type="submit">登入</button>
        </form>

        <a href="#" class="forgot-link">忘記密碼</a>
        <div class="divider">或</div>

        <div class="social-login">
            <button class="facebook">Facebook</button>
            <button class="google">Google</button>
        </div>

        <p class="register">還不是會員？<a href="#">註冊</a></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
